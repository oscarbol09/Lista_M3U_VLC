name: Refresh public playlist

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-playlist
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build playlist from public catalogs
        run: node exportar-lista-vlc.mjs

      - name: Remove tokenized stream URLs
        run: node prepare-public-playlist.mjs

      - name: Publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canales-hispano-latino-vlc.m3u
          if git diff --cached --quiet; then
            echo "Playlist unchanged."
          else
            git commit -m "Refresh public playlist"
            git push
          fi